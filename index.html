<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Absensi Karyawan - FA DIGITAL STUDIO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; }
        :root {
            --primary: #1565C0;
            --primary-dark: #0D47A1;
            --success: #2E7D32;
            --warning: #F57C00;
            --danger: #D32F2F;
            --light: #F8FAFC;
            --white: #FFFFFF;
            --gray-100: #F1F5F9;
            --gray-200: #E2E8F0;
            --gray-500: #64748B;
            --gray-700: #334155;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.07);
            --shadow-lg: 0 10px 15px rgba(0,0,0,0.1);
            --radius: 12px;
        }

        body {
            background-color: var(--light);
            color: var(--gray-700);
            line-height: 1.5;
        }

        /* Header */
        .app-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--white);
            padding: 24px 20px 32px;
            border-radius: 0 0 24px 24px;
            box-shadow: var(--shadow-lg);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-header h1 {
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 4px;
        }

        .app-header p {
            font-size: 14px;
            opacity: 0.9;
            text-align: center;
        }

        /* Container */
        .container {
            max-width: 480px;
            margin: -20px auto 24px;
            padding: 0 16px;
        }

        /* Card */
        .card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--gray-200);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 16px;
            text-align: center;
        }

        /* Info Panel */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .info-item {
            background: var(--gray-100);
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .info-icon {
            font-size: 18px;
            color: var(--primary);
        }

        /* Input */
        input {
            width: 100%;
            padding: 14px 16px;
            margin: 8px 0;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            font-size: 15px;
            background: var(--white);
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.15);
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 8px 0;
        }

        .btn-primary { background: var(--primary); color: var(--white); }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-camera { background: #7B1FA2; color: var(--white); }
        .btn-success { background: var(--success); color: var(--white); }
        .btn-success:disabled { background: #A5D6A7; cursor: not-allowed; }
        .btn-warning { background: var(--warning); color: var(--white); }
        .btn-warning:disabled { background: #FFCC80; cursor: not-allowed; }
        .btn-danger { background: var(--danger); color: var(--white); margin-top: 24px; }

        /* Camera & Photo */
        .camera-container {
            width: 100%;
            max-width: 280px;
            margin: 16px auto;
            border-radius: var(--radius);
            overflow: hidden;
            border: 2px solid var(--gray-200);
            display: none;
        }

        #areaKamera {
            width: 100%;
            height: auto;
            display: block;
        }

        #hasilFoto {
            width: 160px;
            height: 160px;
            margin: 16px auto;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--gray-200);
            box-shadow: var(--shadow-sm);
            display: none;
        }

        /* Riwayat Absen */
        .riwayat-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--gray-700);
            margin: 20px 0 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--gray-200);
        }

        .riwayat-item {
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid var(--gray-500);
            background: var(--gray-100);
        }

        .riwayat-item.masuk { border-left-color: var(--success); }
        .riwayat-item.pulang { border-left-color: var(--warning); }

        .riwayat-tanggal {
            font-weight: 500;
            font-size: 14px;
            color: var(--gray-700);
        }

        .riwayat-waktu {
            font-size: 13px;
            color: var(--gray-500);
            margin-top: 4px;
        }

        .riwayat-status {
            font-size: 13px;
            font-weight: 500;
            margin-top: 4px;
        }

        .kosong {
            text-align: center;
            color: var(--gray-500);
            padding: 30px;
            font-style: italic;
        }

        /* Halaman */
        #halamanUtama { display: none; }
        #halamanLogin { display: block; }
    </style>
</head>
<body>

<div class="app-header">
    <h1>FA DIGITAL STUDIO</h1>
    <p>Sistem Absensi Karyawan</p>
</div>

<div class="container">
    <!-- Halaman Login -->
    <div class="card" id="halamanLogin">
        <h2 class="card-title">Masuk ke Sistem</h2>
        <input type="text" id="inputHp" placeholder="Nomor HP" required>
        <input type="password" id="inputSandi" placeholder="Kata Sandi" required>
        <button class="btn btn-primary" onclick="prosesLogin()">Masuk</button>
    </div>

    <!-- Halaman Utama -->
    <div class="card" id="halamanUtama">
        <h2 class="card-title">Selamat Datang</h2>
        <p style="text-align:center; font-size:16px; margin-bottom:20px; font-weight:500;">Halo, <span id="namaPengguna"></span> 👋</p>

        <div class="info-grid">
            <div class="info-item">
                <span class="info-icon">📅</span>
                <span>Tanggal: <strong id="tglSekarang"></strong></span>
            </div>
            <div class="info-item">
                <span class="info-icon">⏰</span>
                <span>Jam: <strong id="jamSekarang"></strong></span>
            </div>
            <div class="info-item">
                <span class="info-icon">📍</span>
                <span>Lokasi: <strong id="teksLokasi">Memuat...</strong></span>
            </div>
        </div>

        <!-- Bagian Foto -->
        <button class="btn btn-camera" onclick="bukaAmbilFoto()">📸 Ambil Foto Absen</button>
        <div class="camera-container">
            <video id="areaKamera" autoplay playsinline></video>
        </div>
        <img id="hasilFoto" alt="Foto Absen">

        <!-- Tombol Absen -->
        <button class="btn btn-success" id="btnAbsenMasuk" onclick="lakukanAbsen('masuk')" disabled>✅ Absen Masuk</button>
        <button class="btn btn-warning" id="btnAbsenPulang" onclick="lakukanAbsen('pulang')" disabled>🏁 Absen Pulang</button>

        <!-- Riwayat Absen -->
        <h3 class="riwayat-title">📋 Riwayat Absen Saya</h3>
        <div id="daftarRiwayatAbsen">
            <div class="kosong">Belum ada riwayat absen</div>
        </div>

        <button class="btn btn-danger" onclick="prosesLogout()">🚪 Keluar Akun</button>
    </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
const config = {
    apiKey: "AIzaSyCMUw8KwCeSNY41i5EmmqKexzLp5RRMNoY",
    authDomain: "daftar-absen-cc868.firebaseapp.com",
    databaseURL: "https://daftar-absen-cc868-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "daftar-absen-cc868",
    appId: "1:486404759637:web:120404fde3e0c1f1d0b4dc"
};

if (!firebase.apps.length) firebase.initializeApp(config);
const db = firebase.database();

let dataKaryawan = {};
let posisi = { lat: null, lon: null, gpsAktif: false };
let streamKamera = null;
let fotoAbsen = null;

// Update waktu setiap detik
setInterval(() => {
    const sekarang = new Date();
    document.getElementById("tglSekarang").textContent = sekarang.toLocaleDateString("id-ID");
    document.getElementById("jamSekarang").textContent = sekarang.toLocaleTimeString("id-ID");
}, 1000);

// --- Simpan & Baca Login ---
function simpanLogin(data) {
    localStorage.setItem("dataKaryawan", JSON.stringify(data));
}

function cekLoginTersimpan() {
    const tersimpan = localStorage.getItem("dataKaryawan");
    if (tersimpan) {
        dataKaryawan = JSON.parse(tersimpan);
        tampilkanHalamanUtama();
        ambilLokasi();
        muatRiwayatAbsenPribadi();
    }
}

cekLoginTersimpan();

// --- Proses Login ---
function prosesLogin() {
    const hp = document.getElementById("inputHp").value.trim();
    const sandi = document.getElementById("inputSandi").value.trim();

    if (!hp || !sandi) return alert("Masukkan nomor HP dan sandi!");

    db.ref("data_karyawan").orderByChild("hp").equalTo(hp).once("value", snap => {
        if (!snap.exists()) return alert("Nomor HP tidak terdaftar!");

        const data = snap.val();
        const kunci = Object.keys(data)[0];
        const d = data[kunci];

        if (d.sandi === sandi) {
            dataKaryawan = d;
            simpanLogin(d);
            catatAktivitas(d.nama, "login");
            tampilkanHalamanUtama();
            ambilLokasi();
            muatRiwayatAbsenPribadi();
        } else {
            alert("Kata sandi salah!");
        }
    });
}

function tampilkanHalamanUtama() {
    document.getElementById("namaPengguna").textContent = dataKaryawan.nama;
    document.getElementById("halamanLogin").style.display = "none";
    document.getElementById("halamanUtama").style.display = "block";
}

// --- Proses Logout ---
function prosesLogout() {
    if (!confirm("Yakin ingin keluar?")) return;
    catatAktivitas(dataKaryawan.nama, "logout");
    localStorage.removeItem("dataKaryawan");
    tutupKamera();
    resetTampilan();
}

function resetTampilan() {
    document.getElementById("halamanLogin").style.display = "block";
    document.getElementById("halamanUtama").style.display = "none";
    document.getElementById("inputHp").value = "";
    document.getElementById("inputSandi").value = "";
    document.getElementById("hasilFoto").style.display = "none";
    document.getElementById("daftarRiwayatAbsen").innerHTML = "<div class='kosong'>Belum ada riwayat absen</div>";
    fotoAbsen = null;
    dataKaryawan = {};
    posisi = { lat: null, lon: null, gpsAktif: false };
    document.getElementById("teksLokasi").textContent = "Memuat...";
    tombolAbsenMati();
}

// --- Ambil Lokasi GPS ---
function ambilLokasi() {
    if (!navigator.geolocation) {
        document.getElementById("teksLokasi").textContent = "❌ GPS tidak didukung";
        return;
    }
    navigator.geolocation.getCurrentPosition(
        (hasil) => {
            posisi.lat = hasil.coords.latitude.toFixed(6);
            posisi.lon = hasil.coords.longitude.toFixed(6);
            posisi.gpsAktif = true;
            document.getElementById("teksLokasi").textContent = `${posisi.lat}, ${posisi.lon}`;
        },
        () => {
            posisi.gpsAktif = false;
            document.getElementById("teksLokasi").textContent = "⚠️ GPS tidak aktif";
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
}

// --- Kamera & Foto ---
function bukaAmbilFoto() {
    tutupKamera();
    fotoAbsen = null;
    document.getElementById("hasilFoto").style.display = "none";
    document.querySelector(".camera-container").style.display = "block";

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
    .then(stream => {
        streamKamera = stream;
        document.getElementById("areaKamera").srcObject = stream;
        setTimeout(ambilFotoOtomatis, 2000);
    })
    .catch(() => alert("❌ Tidak bisa mengakses kamera! Izinkan akses kamera di pengaturan."));
}

function ambilFotoOtomatis() {
    const video = document.getElementById("areaKamera");
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);
    fotoAbsen = canvas.toDataURL("image/jpeg", 0.8);

    tutupKamera();
    document.getElementById("hasilFoto").src = fotoAbsen;
    document.getElementById("hasilFoto").style.display = "block";
    tombolAbsenHidup();
}

function tutupKamera() {
    if (streamKamera) {
        streamKamera.getTracks().forEach(track => track.stop());
        streamKamera = null;
    }
    document.querySelector(".camera-container").style.display = "none";
}

// --- Kontrol Tombol Absen ---
function tombolAbsenHidup() {
    document.getElementById("btnAbsenMasuk").disabled = false;
    document.getElementById("btnAbsenPulang").disabled = false;
}

function tombolAbsenMati() {
    document.getElementById("btnAbsenMasuk").disabled = true;
    document.getElementById("btnAbsenPulang").disabled = true;
}

// --- Proses Absen ---
function lakukanAbsen(tipe) {
    if (!posisi.lat || !posisi.lon) {
        alert("Sedang mengambil lokasi, tunggu sebentar...");
        ambilLokasi();
        setTimeout(() => lakukanAbsen(tipe), 2000);
        return;
    }
    if (!fotoAbsen) {
        alert("Silakan ambil foto terlebih dahulu!");
        return;
    }

    const sekarang = new Date();
    const waktu = sekarang.toLocaleString("id-ID");
    const tgl = sekarang.toISOString().split("T")[0];

    const data = {
        nama: dataKaryawan.nama,
        hp: dataKaryawan.hp,
        status: tipe === "masuk" ? "Absen Masuk" : "Absen Pulang",
        waktu: waktu,
        tanggal: tgl,
        foto: fotoAbsen,
        lat: posisi.lat,
        lon: posisi.lon,
        gps_active: posisi.gpsAktif,
        perangkat: dapatkanInfoPerangkat()
    };

    db.ref("riwayat_absen").push(data)
    .then(() => {
        alert(`✅ Absen ${tipe} berhasil disimpan!`);
        fotoAbsen = null;
        document.getElementById("hasilFoto").style.display = "none";
        tombolAbsenMati();
        muatRiwayatAbsenPribadi();
    })
    .catch(err => alert("❌ Gagal menyimpan: " + err.message));
}

// --- Muat Riwayat Absen ---
function muatRiwayatAbsenPribadi() {
    db.ref("riwayat_absen")
        .orderByChild("hp")
        .equalTo(dataKaryawan.hp)
        .limitToLast(15)
        .on("value", snap => {
            const data = snap.val() || {};
            let html = "";

            if (Object.keys(data).length === 0) {
                html = "<div class='kosong'>Belum ada riwayat absen</div>";
            } else {
                Object.keys(data).reverse().forEach(k => {
                    const d = data[k];
                    const kelas = d.status.includes("Masuk") ? "masuk" : "pulang";
                    html += `
                    <div class="riwayat-item ${kelas}">
                        <div class="riwayat-tanggal">${d.tanggal || "-"}</div>
                        <div class="riwayat-waktu">${d.waktu || "-"}</div>
                        <div class="riwayat-status">${d.status || "-"}</div>
                    </div>`;
                });
            }
            document.getElementById("daftarRiwayatAbsen").innerHTML = html;
        });
}

// --- Fungsi Pendukung ---
function dapatkanInfoPerangkat() {
    const ua = navigator.userAgent;
    if (ua.includes("Android")) return "HP Android";
    if (ua.includes("iPhone") || ua.includes("iPad")) return "iPhone / iPad";
    if (ua.includes("Windows")) return "Komputer Windows";
    if (ua.includes("Mac")) return "Komputer Mac";
    return "Perangkat Lain";
}

function catatAktivitas(nama, jenis) {
    const waktu = new Date().toLocaleString("id-ID");
    db.ref("riwayat_aktivitas").push({
        nama: nama,
        jenis: jenis,
        waktu: waktu,
        perangkat: dapatkanInfoPerangkat(),
        lokasi: posisi.lat && posisi.lon ? `${posisi.lat}, ${posisi.lon}` : "Tidak diketahui"
    });
}
</script>

</body>
</html>
