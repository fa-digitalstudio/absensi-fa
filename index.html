<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daftar Absensi - FA DIGITAL STUDIO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        :root {
            --utama: #2c3e50;
            --hijau: #27ae60;
            --kuning: #f39c12;
            --merah: #e74c3c;
            --abu: #f8f9fa;
            --abu-terang: #f3f4f6;
            --batas: #e5e7eb;
            --teks: #333333;
            --teks-reduksi: #6b7280;
            --putih: #ffffff;
        }

        body {
            background: var(--abu);
            color: var(--teks);
            line-height: 1.5;
        }

        /* Header */
        .header {
            background: var(--utama);
            color: var(--putih);
            padding: 24px 20px;
            border-radius: 0 0 20px 20px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .header h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
        .header p { font-size: 14px; opacity: 0.9; }

        /* Container */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* Card */
        .card {
            background: var(--putih);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid var(--batas);
        }

        .card h3 {
            text-align: center;
            color: var(--utama);
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--batas);
        }

        /* Tombol */
        .btn-muat {
            background: var(--utama);
            color: var(--putih);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 12px;
        }

        /* Tabel */
        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--batas);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        table th {
            background: var(--abu);
            padding: 12px 8px;
            text-align: left;
            font-weight: 600;
            color: var(--utama);
            border-bottom: 1px solid var(--batas);
        }
        table td {
            padding: 12px 8px;
            border-bottom: 1px solid var(--batas);
            vertical-align: middle;
        }
        table tr:nth-child(even) { background: var(--abu-terang); }
        .kosong {
            text-align: center;
            padding: 30px;
            color: var(--teks-reduksi);
            font-style: italic;
        }

        /* Status & Foto */
        .status-masuk { color: var(--hijau); font-weight: 500; }
        .status-pulang { color: var(--kuning); font-weight: 500; }
        .foto-absen {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid var(--batas);
        }
        .link-peta {
            font-size: 12px;
            color: var(--utama);
            text-decoration: none;
        }

        /* Link ke Admin */
        .link-admin {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: var(--utama);
            font-weight: 500;
            text-decoration: none;
        }
        .link-admin:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>FA DIGITAL STUDIO</h1>
    <p>Daftar Absensi Karyawan</p>
</div>

<div class="container">
    <div class="card">
        <h3>📋 Data Absensi Terkini</h3>
        <button class="btn-muat" onclick="muatDaftarAbsen()">🔄 Muat Ulang Data</button>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Lengkap</th>
                        <th>Tanggal</th>
                        <th>Jam</th>
                        <th>Status</th>
                        <th>Lokasi</th>
                        <th>Foto</th>
                    </tr>
                </thead>
                <tbody id="tabelAbsen">
                    <tr><td colspan="7" class="kosong">Belum ada data absen karyawan</td></tr>
                </tbody>
            </table>
        </div>

        <a href="admin.html" class="link-admin">🔐 Masuk ke Halaman Admin</a>
    </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
const config = {
    apiKey: "AIzaSyCMUw8KwCeSNY41i5EmmqKexzLp5RRMNoY",
    authDomain: "daftar-absen-cc868.firebaseapp.com",
    databaseURL: "https://daftar-absen-cc868-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "daftar-absen-cc868",
    storageBucket: "daftar-absen-cc868.appspot.com",
    appId: "1:486404759637:web:120404fde3e0c1f1d0b4dc"
};

if (!firebase.apps.length) firebase.initializeApp(config);
const db = firebase.database();

// Fungsi memuat data absen - DIPERBAIKI
function muatDaftarAbsen() {
    // Ambil data dari jalur "riwayat_absen" dan urutkan dari terbaru
    db.ref("riwayat_absen")
      .orderByKey()
      .limitToLast(100)
      .once("value")
      .then(snap => {
        const data = snap.val();
        let html = "";
        let nomor = 1;

        // Cek apakah ada data
        if (!data || Object.keys(data).length === 0) {
            html = "<tr><td colspan='7' class='kosong'>Belum ada karyawan yang melakukan absen</td></tr>";
        } else {
            // Balik urutan agar yang terbaru ada di atas
            const daftar = Object.entries(data).reverse();
            
            daftar.forEach(([kunci, d]) => {
                const kelasStatus = d.status === "Masuk" ? "status-masuk" : "status-pulang";
                
                const lokasi = (d.lat && d.lon) 
                    ? `<a href="https://www.google.com/maps?q=${d.lat},${d.lon}" target="_blank" class="link-peta">Lihat Peta</a>` 
                    : "-";
                
                const foto = d.foto 
                    ? `<img src="${d.foto}" class="foto-absen" alt="Foto Absen">` 
                    : "-";

                html += `
                <tr>
                    <td>${nomor++}</td>
                    <td>${d.nama || "-"}</td>
                    <td>${d.tanggal || "-"}</td>
                    <td>${d.jam || "-"}</td>
                    <td class="${kelasStatus}">${d.status || "-"}</td>
                    <td>${lokasi}</td>
                    <td>${foto}</td>
                </tr>`;
            });
        }

        document.getElementById("tabelAbsen").innerHTML = html;
    })
    .catch(err => {
        console.error("Gagal mengambil data:", err);
        document.getElementById("tabelAbsen").innerHTML = "<tr><td colspan='7' class='kosong'>Terjadi kesalahan memuat data</td></tr>";
    });
}

// Jalankan saat halaman dibuka
window.onload = () => {
    muatDaftarAbsen();
};
</script>

</body>
</html>
