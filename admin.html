<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel Admin - FA DIGITAL STUDIO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        :root {
            --utama: #2c3e50;
            --hijau: #27ae60;
            --kuning: #f39c12;
            --merah: #e74c3c;
            --abu: #f8f9fa;
            --abu-terang: #f3f4f6;
            --batas: #e5e7eb;
            --teks: #333333;
            --teks-reduksi: #6b7280;
            --putih: #ffffff;
        }

        body {
            background: var(--abu);
            color: var(--teks);
            line-height: 1.5;
        }

        /* Header */
        .header {
            background: var(--utama);
            color: var(--putih);
            padding: 24px 20px;
            border-radius: 0 0 20px 20px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        .header h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
        .header p { font-size: 14px; opacity: 0.9; }

        /* Container */
        .container {
            max-width: 1000px;
            margin: 24px auto;
            padding: 0 16px;
        }

        /* Card */
        .card {
            background: var(--putih);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid var(--batas);
        }

        .card h3 {
            color: var(--utama);
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--batas);
        }

        /* Tabel Umum */
        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--batas);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        table th {
            background: var(--abu);
            padding: 12px 10px;
            text-align: left;
            font-weight: 600;
            color: var(--utama);
            border-bottom: 1px solid var(--batas);
        }
        table td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--batas);
            color: var(--teks);
            vertical-align: middle;
        }
        table tr:nth-child(even) { background: var(--abu-terang); }
        .kosong {
            text-align: center;
            padding: 30px;
            color: var(--teks-reduksi);
            font-style: italic;
        }

        /* Status Warna */
        .status-masuk { color: var(--hijau); font-weight: 500; }
        .status-pulang { color: var(--kuning); font-weight: 500; }

        /* Foto Absen */
        .foto-absen {
            width: 60px;
            height: 60px;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid var(--batas);
        }

        /* Tombol */
        .btn-hapus {
            background: var(--merah);
            color: var(--putih);
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-hapus:hover {
            background: #c0392b;
        }
        .btn-muat {
            background: var(--utama);
            color: var(--putih);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>FA DIGITAL STUDIO</h1>
    <p>Panel Admin - Data & Riwayat Absensi</p>
</div>

<div class="container">

    <!-- Bagian Data Karyawan -->
    <div class="card">
        <h3>👥 Data Karyawan</h3>
        <button class="btn-muat" onclick="muatDataKaryawan()">🔄 Muat Ulang</button>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Lengkap</th>
                        <th>Nomor HP</th>
                        <th>Status Akun</th>
                    </tr>
                </thead>
                <tbody id="tabelKaryawan">
                    <tr><td colspan="4" class="kosong">Belum ada data karyawan</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bagian Riwayat Absen -->
    <div class="card">
        <h3>📋 Riwayat Absen Karyawan</h3>
        <button class="btn-muat" onclick="muatRiwayatAbsen()">🔄 Muat Ulang</button>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama</th>
                        <th>Tanggal</th>
                        <th>Jam</th>
                        <th>Status</th>
                        <th>Keterangan</th>
                        <th>Lokasi GPS</th>
                        <th>Foto</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabelRiwayatAbsen">
                    <tr><td colspan="9" class="kosong">Belum ada riwayat absen</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
const config = {
    apiKey: "AIzaSyCMUw8KwCeSNY41i5EmmqKexzLp5RRMNoY",
    authDomain: "daftar-absen-cc868.firebaseapp.com",
    databaseURL: "https://daftar-absen-cc868-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "daftar-absen-cc868",
    appId: "1:486404759637:web:120404fde3e0c1f1d0b4dc"
};

if (!firebase.apps.length) firebase.initializeApp(config);
const db = firebase.database();

// --- Muat Data Karyawan ---
function muatDataKaryawan() {
    db.ref("data_karyawan").once("value", snap => {
        const data = snap.val() || {};
        let html = "";
        let nomor = 1;

        if (Object.keys(data).length === 0) {
            html = "<tr><td colspan='4' class='kosong'>Belum ada data karyawan</td></tr>";
        } else {
            Object.values(data).forEach(k => {
                html += `
                <tr>
                    <td>${nomor++}</td>
                    <td>${k.nama || "-"}</td>
                    <td>${k.hp || "-"}</td>
                    <td>Aktif</td>
                </tr>`;
            });
        }
        document.getElementById("tabelKaryawan").innerHTML = html;
    });
}

// --- Muat Riwayat Absen ---
function muatRiwayatAbsen() {
    db.ref("riwayat_absen").orderByKey().limitToLast(50).once("value", snap => {
        const data = snap.val() || {};
        let html = "";
        let nomor = 1;

        if (Object.keys(data).length === 0) {
            html = "<tr><td colspan='9' class='kosong'>Belum ada riwayat absen</td></tr>";
        } else {
            // Urutkan dari yang terbaru ke terlama
            const daftar = Object.entries(data).reverse();
            daftar.forEach(([kunci, d]) => {
                const kelasStatus = d.status === "Masuk" ? "status-masuk" : "status-pulang";
                const lokasi = d.lat && d.lon ? `${d.lat}, ${d.lon}` : "Tidak terdeteksi";
                const tautanPeta = d.lat && d.lon 
                    ? `<a href="https://www.google.com/maps?q=${d.lat},${d.lon}" target="_blank" style="color:var(--utama);">Lihat Peta</a>` 
                    : "-";

                html += `
                <tr>
                    <td>${nomor++}</td>
                    <td>${d.nama || "-"}</td>
                    <td>${d.tanggal || "-"}</td>
                    <td>${d.jam || "-"}</td>
                    <td class="${kelasStatus}">${d.status || "-"}</td>
                    <td>${d.keterangan || "-"}</td>
                    <td>${lokasi}<br>${tautanPeta}</td>
                    <td>
                        ${d.foto ? `<img src="${d.foto}" class="foto-absen" alt="Foto Absen">` : "-"}
                    </td>
                    <td>
                        <button class="btn-hapus" onclick="hapusAbsen('${kunci}')">Hapus</button>
                    </td>
                </tr>`;
            });
        }
        document.getElementById("tabelRiwayatAbsen").innerHTML = html;
    });
}

// --- Hapus Data Absen ---
function hapusAbsen(kunciData) {
    if (!confirm("Yakin ingin menghapus data absen ini? Tindakan tidak dapat dibatalkan.")) return;

    db.ref(`riwayat_absen/${kunciData}`).remove()
        .then(() => {
            alert("✅ Data absen berhasil dihapus!");
            muatRiwayatAbsen();
        })
        .catch(err => {
            alert("❌ Gagal menghapus: " + err.message);
        });
}

// Jalankan otomatis saat halaman dibuka
window.onload = () => {
    muatDataKaryawan();
    muatRiwayatAbsen();
};
</script>

</body>
</html>
