<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Admin Dashboard - FA DIGITAL STUDIO</title>
    <style>
        body { 
            font-family: sans-serif; 
            background-color: #f4f7f6; 
            color: #333; 
            margin: 0; 
            padding: 0; 
            padding-bottom: 100px; 
        }
        
        .top-banner { 
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); 
            color: white; 
            padding: 30px 20px; 
            text-align: center; 
            border-bottom-left-radius: 25px; 
            border-bottom-right-radius: 25px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .top-banner h1 { margin: 0; font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }
        .top-banner p { margin: 5px 0 0; font-size: 13px; opacity: 0.9; }

        .container { padding: 0 15px; }
        .card { 
            background: #ffffff; 
            padding: 20px; 
            border-radius: 15px; 
            margin-bottom: 20px; 
            border: 1px solid #ddd; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
        }
        h2 { 
            text-align: center; 
            color: #2c3e50; 
            margin: 10px 0; 
            font-size: 18px; 
            font-weight: bold; 
        }
        h3 {
            font-size: 15px;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
            margin-top:0;
        }
        
        input, select, button, textarea { 
            width: 100%; 
            padding: 12px; 
            margin-top: 10px; 
            border-radius: 8px; 
            border: 1px solid #ccc; 
            background: #fafafa; 
            color: #333; 
            box-sizing: border-box; 
            font-size: 14px; 
        }
        button { 
            background: #2c3e50; 
            color: #ffffff; 
            font-weight: bold; 
            border: none; 
            cursor: pointer; 
            transition: 0.3s; 
        }
        button:active { transform: scale(0.95); }
        .btn-success { background: #27ae60; }
        .btn-danger { background: #e74c3c; }
        .btn-warning { background: #f39c12; }
        .btn-secondary { background: #95a5a6; }

        .modal-login { 
            display: flex; 
            position: fixed; 
            z-index: 3000; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.8); 
            justify-content: center; 
            align-items: center; 
        }
        .modal-content { 
            background: white; 
            padding: 25px; 
            border-radius: 20px; 
            width: 80%; 
            max-width: 300px; 
            text-align: center; 
            animation: zoomIn 0.3s ease; 
        }
        @keyframes zoomIn { 
            from { transform: scale(0.5); opacity: 0; } 
            to { transform: scale(1); opacity: 1; } 
        }

        .karyawan-item {
            background: #fdfdfd;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 12px;
            border-left: 4px solid #2c3e50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .karyawan-info { flex:1; }
        .karyawan-nama { font-weight: bold; font-size:14px; }
        .karyawan-hp { font-size:12px; color:#666; margin-top:3px; }
        .karyawan-aksi { display:flex; gap:6px; }
        .karyawan-aksi button { padding:6px 10px; font-size:12px; width:auto; }

        .modal-edit {
            display: none;
            position: fixed;
            z-index: 3001;
            top:0; left:0;
            width:100%; height:100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
        }
        .modal-edit-content {
            background: white;
            padding:20px;
            border-radius:15px;
            width:85%;
            max-width:320px;
        }

        .footer-credit { 
            text-align: center; 
            padding: 20px 0; 
            font-size: 12px; 
            color: #7f8c8d; 
            border-top: 1px solid #eee; 
            margin-top: 20px; 
        }
        .footer-credit b { color: #2c3e50; }
    </style>
</head>

<body>
    <!-- Modal Login Admin -->
    <div class='modal-login' id='modalLogin'>
        <div class='modal-content'>
            <h3 style='margin-top:0; color:#2c3e50;'>LOGIN ADMIN</h3>
            <input id='inputPassAdmin' placeholder='Masukkan Kode Akses' type='password'/>
            <button onclick='cekLogin()'>MASUK</button>
        </div>
    </div>

    <!-- Konten Setelah Login -->
    <div id='kontenAdmin' style='display:none;'>
        <div class='top-banner'>
            <h1>ADMIN DASHBOARD</h1>
            <p>FA DIGITAL STUDIO - Pengelolaan Data</p>
        </div>

        <div class='container'>
            <!-- Form Daftar Karyawan -->
            <div class="card">
                <h3>TAMBAH KARYAWAN BARU</h3>
                <input id="namaKaryawan" placeholder="Nama Lengkap" type="text" required/>
                <input id="hpKaryawan" placeholder="Nomor HP" type="text" required/>
                <input id="sandiKaryawan" placeholder="Kata Sandi" type="password" required/>
                <button class="btn-success" onclick="tambahKaryawan()">SIMPAN DATA</button>
            </div>

            <!-- Daftar Karyawan -->
            <div class="card">
                <h3>DAFTAR KARYAWAN</h3>
                <div id="daftarKaryawan">Memuat data...</div>
            </div>

            <!-- Modal Edit Karyawan -->
            <div class="modal-edit" id="modalEdit">
                <div class="modal-edit-content">
                    <h3 style="text-align:center; margin-top:0;">UBAH DATA</h3>
                    <input id="editNama" placeholder="Nama Lengkap" type="text"/>
                    <input id="editHp" placeholder="Nomor HP" type="text"/>
                    <input id="editSandi" placeholder="Kata Sandi Baru (kosongkan jika tidak diubah)" type="password"/>
                    <div style="display:flex; gap:10px; margin-top:15px;">
                        <button class="btn-secondary" onclick="tutupModalEdit()" style="flex:1;">BATAL</button>
                        <button class="btn-warning" onclick="simpanEdit()" style="flex:1;">SIMPAN</button>
                    </div>
                </div>
            </div>

            <div class='footer-credit'>
                <a href="index.html" style="color:#2c3e50; text-decoration:none; font-weight:bold;">← Kembali ke Halaman Absen</a><br/><br/>
                Copyright &#169; 2026 <b>Farid Aris</b>. All rights reserved.<br/>
                FA DIGITAL STUDIO
            </div>
        </div>
    </div>

    <script src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'></script>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js'></script>
    <script src='https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js'></script>
    <script src='https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js'></script>

    <script type='text/javascript'>
    (function() {
        const config = {
            apiKey: "AIzaSyCMUw8KwCeSNY41i5EmmqKexzLp5RRMNoY",
            authDomain: "daftar-absen-cc868.firebaseapp.com",
            databaseURL: "https://daftar-absen-cc868-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "daftar-absen-cc868",
            appId: "1:486404759637:web:120404fde3e0c1f1d0b4dc"
        };

        if (!firebase.apps.length) firebase.initializeApp(config);
        const db = firebase.database();
        const KODE_ADMIN = "farid1234";
        let idEdit = null;

        // Login Admin
        window.cekLogin = function() {
            const input = document.getElementById('inputPassAdmin').value;
            if (input === KODE_ADMIN) {
                document.getElementById('modalLogin').style.display = 'none';
                document.getElementById('kontenAdmin').style.display = 'block';
                muatDaftarKaryawan();
            } else {
                alert("Kode Akses Salah!");
            }
        };

        // Tambah Karyawan
        window.tambahKaryawan = function() {
            const nama = document.getElementById('namaKaryawan').value.trim();
            const hp = document.getElementById('hpKaryawan').value.trim();
            const sandi = document.getElementById('sandiKaryawan').value.trim();
            if (!nama || !hp || !sandi) return alert("Isi semua kolom!");

            db.ref('data_karyawan').orderByChild('hp').equalTo(hp).once('value', function(s) {
                if (s.exists()) return alert("Nomor HP sudah terdaftar!");
                
                db.ref('data_karyawan').push({ nama, hp, sandi })
                .then(() => {
                    alert("Berhasil ditambahkan!");
                    document.getElementById('namaKaryawan').value = "";
                    document.getElementById('hpKaryawan').value = "";
                    document.getElementById('sandiKaryawan').value = "";
                });
            });
        };

        // Muat Daftar Karyawan
        function muatDaftarKaryawan() {
            db.ref('data_karyawan').on('value', function(s) {
                const data = s.val();
                const wadah = document.getElementById('daftarKaryawan');
                if (!data) return wadah.innerHTML = "<p style='text-align:center; color:#888;'>Belum ada data karyawan.</p>";

                wadah.innerHTML = "";
                Object.keys(data).forEach(k => {
                    const d = data[k];
                    const html = `
                    <div class="karyawan-item">
                        <div class="karyawan-info">
                            <div class="karyawan-nama">${d.nama}</div>
                            <div class="karyawan-hp">HP: ${d.hp}</div>
                        </div>
                        <div class="karyawan-aksi">
                            <button class="btn-warning" onclick="bukaEdit('${k}', '${d.nama}', '${d.hp}')">Edit</button>
                            <button class="btn-danger" onclick="hapusKaryawan('${k}')">Hapus</button>
                        </div>
                    </div>`;
                    wadah.insertAdjacentHTML('beforeend', html);
                });
            });
        }

        // Buka Modal Edit
        window.bukaEdit = function(id, nama, hp) {
            idEdit = id;
            document.getElementById('editNama').value = nama;
            document.getElementById('editHp').value = hp;
            document.getElementById('editSandi').value = "";
            document.getElementById('modalEdit').style.display = "flex";
        };

        window.tutupModalEdit = function() {
            document.getElementById('modalEdit').style.display = "none";
            idEdit = null;
        };

        // Simpan Perubahan
        window.simpanEdit = function() {
            const nama = document.getElementById('editNama').value.trim();
            const hp = document.getElementById('editHp').value.trim();
            const sandi = document.getElementById('editSandi').value.trim();
            if (!nama || !hp) return alert("Nama dan HP tidak boleh kosong!");

            const dataBaru = { nama, hp };
            if (sandi) dataBaru.sandi = sandi;

            db.ref('data_karyawan/' + idEdit).update(dataBaru)
            .then(() => {
                alert("Data berhasil diperbarui!");
                tutupModalEdit();
            });
        };

        // Hapus Karyawan
        window.hapusKaryawan = function(id) {
            if (!confirm("Yakin ingin menghapus data ini?")) return;
            db.ref('data_karyawan/' + id).remove();
        };

    })();
    </script>
</body>
</html>
