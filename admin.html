<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Absen Karyawan - FA DIGITAL STUDIO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #f4f7f6; color: #333; padding-bottom: 80px; }
        .header {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .header h1 { font-size: 20px; margin-bottom: 5px; }
        .header p { font-size: 13px; opacity: 0.9; }
        .container { padding: 15px; }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        h3 { margin-bottom: 15px; color: #2c3e50; text-align: center; }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 15px;
        }
        button {
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary { background: #2c3e50; color: white; }
        .btn-success { background: #27ae60; color: white; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .info {
            background: #e8f4fd;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
            color: #2980b9;
        }
        #halamanAbsen { display: none; }
        #halamanLogin { display: block; }
        #areaKamera {
            width: 100%;
            max-width: 320px;
            margin: 15px auto;
            border-radius: 8px;
            border: 2px solid #ddd;
            display: none;
        }
        #hasilFoto {
            width: 100%;
            max-width: 200px;
            margin: 10px auto;
            border-radius: 8px;
            display: none;
        }
        .status {
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            margin: 10px 0;
            font-weight: bold;
        }
        .status-ok { background: #d4edda; color: #155724; }
        .status-warn { background: #fff3cd; color: #856404; }
    </style>
</head>
<body>

<div class="header">
    <h1>FA DIGITAL STUDIO</h1>
    <p>Sistem Absensi Karyawan</p>
</div>

<div class="container">
    <!-- Halaman Login -->
    <div class="card" id="halamanLogin">
        <h3>Login Karyawan</h3>
        <input type="text" id="inputHp" placeholder="Nomor HP" required>
        <input type="password" id="inputSandi" placeholder="Kata Sandi" required>
        <button class="btn-primary" onclick="loginKaryawan()">Masuk</button>
    </div>

    <!-- Halaman Utama Setelah Login -->
    <div id="halamanAbsen">
        <div class="card">
            <h3>Selamat Datang, <span id="namaPengguna"></span></h3>
            <div class="info">
                📅 Tanggal: <span id="tanggalSekarang"></span><br>
                ⏰ Jam: <span id="jamSekarang"></span><br>
                📍 Lokasi: <span id="teksLokasi">Belum diambil</span>
            </div>

            <video id="areaKamera" autoplay playsinline></video>
            <img id="hasilFoto" alt="Hasil Foto">

            <button class="btn-success" onclick="mulaiAbsen('masuk')">✅ Absen Masuk</button>
            <button class="btn-warning" onclick="mulaiAbsen('pulang')">🏁 Absen Pulang</button>
            <br><br>
            <button class="btn-danger" onclick="logoutKaryawan()">🚪 Keluar / Logout</button>
        </div>
    </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
const config = {
    apiKey: "AIzaSyCMUw8KwCeSNY41i5EmmqKexzLp5RRMNoY",
    authDomain: "daftar-absen-cc868.firebaseapp.com",
    databaseURL: "https://daftar-absen-cc868-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "daftar-absen-cc868",
    appId: "1:486404759637:web:120404fde3e0c1f1d0b4dc"
};

if (!firebase.apps.length) firebase.initializeApp(config);
const db = firebase.database();

let dataKaryawan = {};
let posisi = { lat: null, lon: null, gpsAktif: false };
let streamKamera = null;

// Update waktu setiap detik
setInterval(() => {
    const sekarang = new Date();
    document.getElementById("tanggalSekarang").textContent = sekarang.toLocaleDateString("id-ID");
    document.getElementById("jamSekarang").textContent = sekarang.toLocaleTimeString("id-ID");
}, 1000);

// Info perangkat
function dapatkanInfoPerangkat() {
    const ua = navigator.userAgent;
    if (ua.includes("Android")) return "HP Android";
    if (ua.includes("iPhone") || ua.includes("iPad")) return "iPhone / iPad";
    if (ua.includes("Windows")) return "Komputer Windows";
    if (ua.includes("Mac")) return "Komputer Mac";
    return "Perangkat Tidak Dikenal";
}

// Catat aktivitas login/logout
function catatAktivitas(nama, jenis) {
    const waktu = new Date().toLocaleString("id-ID");
    db.ref("riwayat_aktivitas").push({
        nama: nama,
        jenis: jenis,
        waktu: waktu,
        perangkat: dapatkanInfoPerangkat(),
        lokasi: posisi.lat && posisi.lon ? `${posisi.lat}, ${posisi.lon}` : "Tidak diketahui"
    });
}

// Login
function loginKaryawan() {
    const hp = document.getElementById("inputHp").value.trim();
    const sandi = document.getElementById("inputSandi").value.trim();
    if (!hp || !sandi) return alert("Isi nomor HP dan sandi!");

    db.ref("data_karyawan").orderByChild("hp").equalTo(hp).once("value", snap => {
        if (!snap.exists()) return alert("Nomor HP tidak terdaftar!");
        const data = snap.val();
        const kunci = Object.keys(data)[0];
        const d = data[kunci];

        if (d.sandi === sandi) {
            dataKaryawan = d;
            document.getElementById("namaPengguna").textContent = d.nama;
            document.getElementById("halamanLogin").style.display = "none";
            document.getElementById("halamanAbsen").style.display = "block";
            catatAktivitas(d.nama, "login");
            ambilLokasi();
        } else {
            alert("Kata sandi salah!");
        }
    });
}

// Logout
function logoutKaryawan() {
    if (!confirm("Yakin ingin keluar?")) return;
    catatAktivitas(dataKaryawan.nama, "logout");
    tutupKamera();
    document.getElementById("halamanLogin").style.display = "block";
    document.getElementById("halamanAbsen").style.display = "none";
    document.getElementById("inputHp").value = "";
    document.getElementById("inputSandi").value = "";
    dataKaryawan = {};
    posisi = { lat: null, lon: null, gpsAktif: false };
    document.getElementById("teksLokasi").textContent = "Belum diambil";
}

// Ambil lokasi GPS
function ambilLokasi() {
    if (!navigator.geolocation) {
        document.getElementById("teksLokasi").textContent = "❌ GPS tidak didukung";
        return;
    }
    navigator.geolocation.getCurrentPosition(
        (hasil) => {
            posisi.lat = hasil.coords.latitude.toFixed(6);
            posisi.lon = hasil.coords.longitude.toFixed(6);
            posisi.gpsAktif = true;
            document.getElementById("teksLokasi").textContent = `${posisi.lat}, ${posisi.lon}`;
        },
        (err) => {
            posisi.gpsAktif = false;
            document.getElementById("teksLokasi").textContent = "⚠️ GPS tidak aktif";
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
}

// Buka kamera
function bukaKamera() {
    const video = document.getElementById("areaKamera");
    document.getElementById("hasilFoto").style.display = "none";
    video.style.display = "block";

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
    .then(stream => {
        streamKamera = stream;
        video.srcObject = stream;
    })
    .catch(() => alert("❌ Tidak bisa mengakses kamera!"));
}

// Tutup kamera
function tutupKamera() {
    if (streamKamera) {
        streamKamera.getTracks().forEach(track => track.stop());
        streamKamera = null;
    }
    document.getElementById("areaKamera").style.display = "none";
}

// Ambil foto
function ambilFoto() {
    const video = document.getElementById("areaKamera");
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);
    const dataFoto = canvas.toDataURL("image/jpeg", 0.8);

    tutupKamera();
    const img = document.getElementById("hasilFoto");
    img.src = dataFoto;
    img.style.display = "block";
    return dataFoto;
}

// Mulai proses absen
function mulaiAbsen(tipe) {
    if (!posisi.lat || !posisi.lon) {
        alert("⏳ Mengambil lokasi, tunggu sebentar...");
        ambilLokasi();
        setTimeout(() => mulaiAbsen(tipe), 2000);
        return;
    }
    bukaKamera();
    setTimeout(() => simpanAbsen(tipe), 1500);
}

// Simpan data absen ke Firebase
function simpanAbsen(tipe) {
    const foto = ambilFoto();
    const sekarang = new Date();
    const waktu = sekarang.toLocaleString("id-ID");

    const dataAbsen = {
        nama: dataKaryawan.nama,
        hp: dataKaryawan.hp,
        status: tipe === "masuk" ? "Absen Masuk" : "Absen Pulang",
        waktu: waktu,
        foto: foto,
        lat: posisi.lat,
        lon: posisi.lon,
        gps_active: posisi.gpsAktif,
        keterangan: "-",
        tanggal: sekarang.toISOString().split("T")[0]
    };

    db.ref("riwayat_absen").push(dataAbsen)
    .then(() => alert(`✅ Absen ${tipe} berhasil disimpan!`))
    .catch(err => alert("❌ Gagal simpan: " + err.message));
}
</script>
</body>
</html>
